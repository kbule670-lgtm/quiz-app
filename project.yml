name: QuizApp
options:
  bundleIdPrefix: com.kabule
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  # 解 .docx（zip 包）用，Word 导入靠它
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.0
targets:
  QuizApp:
    type: application
    platform: iOS
    dependencies:
      - package: ZIPFoundation
    sources:
      - path: QuizApp
        excludes:
          - "README.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kabule.quizapp
        CFBundleDisplayName: 刷题
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
