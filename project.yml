name: QuizApp
options:
  bundleIdPrefix: com.kabule
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  # 解 .docx（zip 包）用，Word 导入靠它
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.0
targets:
  QuizApp:
    type: application
    platform: iOS
    # Info.plist 必须显式声明让 XcodeGen 生成：2026-10-23 云端编译栽过一次——
    # 没这段时打出的 App 包里没有 Info.plist，最后校验一步直接失败
    info:
      path: QuizApp/Info.plist
      properties:
        CFBundleDisplayName: 刷题
        UILaunchStoryboardName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: ZIPFoundation
    sources:
      - path: QuizApp
        excludes:
          - "README.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kabule.quizapp
        CFBundleDisplayName: 刷题
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
